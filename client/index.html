<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Production-grade, modern personal Expense Tracker & Financial Dashboard application." />
    <title>Expense Tracker - Personal Finance Dashboard</title>
    <!-- SPA redirect restore script for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).filter(function(s) {
            return s.slice(0, 2) === 'p='
          })[0].slice(2);
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + (decoded ? '/' + decoded : '') + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-foreground font-sans antialiased selection:bg-primary/20 selection:text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
